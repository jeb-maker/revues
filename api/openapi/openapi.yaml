          $ref: '#/components/responses/InternalError'
  /admin/integrations/notion:
    get:
      operationId: getAdminNotionSettings
      tags:
        - integrations
        - admin
      summary: Configuration Notion (jeton masqué)
      description: |
        Auth + RequireOrgAdmin (owner/admin org active ou admin global).
        Jamais de jeton en clair — `has_api_token` seulement. Parité métier
        avec l'ancienne UI `/admin/integrations/notion` (WP-021).
      responses:
        '200':
          description: Config Notion courante (ou vide si non configurée)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotionSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: putAdminNotionSettings
      tags:
        - integrations
        - admin
      summary: Enregistrer la configuration Notion chiffrée
      description: |
        Auth + RequireOrgAdmin + CSRF. Jeton omis ou vide = conserve le secret
        existant (`MergeSecret`). Chiffrement AES-GCM (`REVUES_ENCRYPTION_KEY`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotionSettingsUpdate'
      responses:
        '200':
          description: Config enregistrée (jeton masqué)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotionSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteAdminNotionSettings
      tags:
        - integrations
        - admin
      summary: Effacer la configuration Notion
      description: Auth + RequireOrgAdmin + CSRF. Supprime la ligne `integrations` type notion.
      responses:
        '204':
          description: Configuration effacée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/integrations/notion/test:
    post:
      operationId: postAdminNotionTest
      tags:
        - integrations
        - admin
      summary: Tester la connexion Notion (users/me)
      description: |
        Auth + RequireOrgAdmin + CSRF. Utilise le jeton stocké (chiffré).
        Appelle `GET https://api.notion.com/v1/users/me` (Notion-Version 2022-06-28).
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotionTestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs/{runId}/items/{itemId}/attachments:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/RunItemId'
    get:
      operationId: getRunItemAttachment
      tags:
        - attachments
      summary: Métadonnées pièce jointe du point
      description: |
        Auth + accès sujet/revue (IDOR). 404 si aucune pièce ou point hors revue.
      responses:
        '200':
          description: Métadonnées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: uploadRunItemAttachment
      tags:
        - attachments
      summary: Upload pièce jointe (magic bytes, max 5 Mo)
      description: |
        Auth + CanUpdateAccess + run in_progress + CSRF.
        multipart field `file` (JPEG/PNG/WebP/PDF). Remplace l'éventuelle PJ existante.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Fichier (magic bytes validés côté serveur)
      responses:
        '201':
          description: Pièce jointe enregistrée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Corps trop volumineux
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs/{runId}/items/{itemId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/RunItemId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: downloadRunItemAttachment
      tags:
        - attachments
      summary: Télécharger une pièce jointe
      description: |
        Auth + accès sujet/revue (IDOR). Content-Disposition attachment ;
        Content-Type = mime stocké. Vérifie runId/itemId vs attachment.
      responses:
        '200':
          description: Contenu binaire
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="…"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Non authentifié ou identifiants invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF manquant/invalide ou refus
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource absente ou non visible (IDOR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflit métier (ex. version publiée immuable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Erreur interne
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: État de santé
          example: ok
          enum:
          - ok
    ErrorBody:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: validation_failed
        message:
          type: string
          example: Requête invalide.
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    User:
      type: object
      required:
      - id
      - login
      - email
      - display_name
      - role
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: string
        role:
          type: string
          description: Rôle global (admin|editor|reader)
    BootstrapResponse:
      type: object
      required:
      - authenticated
      - csrf_token
      - github_oauth_enabled
      properties:
        authenticated:
          type: boolean
        csrf_token:
          type: string
          description: Jeton CSRF à envoyer en header X-CSRF-Token sur les mutations
        user:
          $ref: '#/components/schemas/User'
        github_oauth_enabled:
          type: boolean
          description: true si REVUES_GITHUB_CLIENT_ID/SECRET sont configurés
        redirect:
          type: string
          description: Chemin SPA suggéré si déjà authentifié
    MeResponse:
      type: object
      required:
      - user
      - csrf_token
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RegisterRequest:
      type: object
      required:
      - email
      - display_name
      - password
      - password_confirm
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        password:
          type: string
          format: password
        password_confirm:
          type: string
          format: password
    AuthSuccessResponse:
      type: object
      required:
      - user
      - csrf_token
      - redirect
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
        redirect:
          type: string
          description: Chemin SPA post-login (org onboarding ou accueil)
    Organization:
      type: object
      required:
      - id
      - name
      - slug
      - role
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        role:
          type: string
