    TemplateVersionListResponse:
      type: object
      required:
      - versions
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/TemplateVersionSummary'
    TemplateWriteRequest:
      type: object
      required:
      - name
      - items
      properties:
        name:
          type: string
          maxLength: 200
        domains:
          type: array
          items:
            type: string
          description: Domaines de matching sujets (vide = tous)
