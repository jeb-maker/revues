        - title
        - subject_id
        - subject_name
        - status
        - created_at
        - progress
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        subject_id:
          type: integer
          format: int64
        subject_name:
          type: string
        status:
          type: string
          enum:
            - draft
            - in_progress
            - done
            - archived
        due_date:
          type: string
          nullable: true
        created_at:
          type: string
        started_at:
          type: string
          nullable: true
        completed_at:
          type: string
          nullable: true
        created_by_login:
          type: string
          nullable: true
        progress:
