    TemplateVersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Numéro de version publiée (1, 2, …)
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Identifiant de la revue
    RunItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Identifiant du point (run item)
