          maxLength: 120
        help_text:
          type: string
          description: Texte d'aide optionnel
          maxLength: 2000
          default: ''
        required:
          type: boolean
          description: Point obligatoire à la revue
          default: false
    TemplateItem:
      type: object
      required:
