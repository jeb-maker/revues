        assigned_to:
          type: integer
          format: int64
          description: Assignee user id (omit = no change)
        unassign:
          type: boolean
          description: true to clear assignee (takes precedence over assigned_to)
    RunDetail:
      type: object
      required:
        - id
        - title
        - subject_id
        - subject_name
        - status
        - template_id
        - template_name
        - template_version
        - created_at
        - progress
        - items
        - capabilities
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        subject_id:
          type: integer
          format: int64
        subject_name:
          type: string
        status:
          type: string
          enum:
            - draft
            - in_progress
            - done
            - archived
        due_date:
          type: string
          nullable: true
        closing_note:
          type: string
        template_id:
          type: integer
          format: int64
        template_name:
          type: string
        template_version:
          type: integer
        created_at:
          type: string
        started_at:
          type: string
          nullable: true
        completed_at:
          type: string
          nullable: true
        progress:
          $ref: '#/components/schemas/RunProgress'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunItem'
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/RunAssignee'
        capabilities:
          $ref: '#/components/schemas/RunCapabilities'
        pending_required_count:
          type: integer
  parameters:
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
