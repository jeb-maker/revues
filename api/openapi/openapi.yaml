openapi: 3.0.3
info:
  title: Revues API
  version: 0.1.0
  description: 'Contrat HTTP JSON de Revues (`/api/v1`). Source de vérité pour le codegen

    serveur (oapi-codegen) et le client TypeScript (WP-005).

    '
servers:
- url: /api/v1
  description: API versionnée
tags:
- name: system
  description: Santé et métadonnées techniques (hors domaines métier)
- name: auth
  description: Session, login local, inscription, CSRF bootstrap
- name: orgs
  description: Organisations — liste, création, sélection active, invitations
- name: admin
  description: Administration organisation — membres, invitations, équipes, politiques
- name: subjects
  description: Sujets (CRUD, membres, domaines)
- name: templates
  description: Modèles de check-list versionnés (catalogue + éditeur)
- name: runs
  description: Revues (lancement, points, clôture)
- name: tasks
  description: Mes tâches — items de revue assignés à l'utilisateur courant
- name: search
  description: Recherche fulltext multi-entités (org active)
- name: integrations
  description: Intégrations externes (Jira, Confluence)
paths:
  /health:
    get:
      operationId: getHealth
      tags:
      - system
      summary: Santé de l'API versionnée
      description: 'Endpoint de health check sous le préfixe versionné. Distinct de

        `GET /healthz` (probe infra hors OpenAPI).

        '
      responses:
        '200':
          description: API joignable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /bootstrap:
    get:
      operationId: getBootstrap
      tags:
      - auth
      summary: Bootstrap session + CSRF
      description: 'Renvoie l''état d''auth courant et un `csrf_token` utilisable par le front.

        Sans session, pose un cookie guest court et dérive le CSRF de ce token.

        Avec session, renvoie l''utilisateur et le CSRF dérivé du cookie `revues_session`.

        '
      responses:
        '200':
          description: État bootstrap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      operationId: getMe
      tags:
      - auth
      summary: Utilisateur authentifié courant
      description: 'Exige une session valide. Renvoie le profil + CSRF (même dérivation que bootstrap).

        '
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/atlassian:
    get:
      operationId: getMeAtlassian
      tags:
      - auth
      - integrations
      summary: Statut OAuth Atlassian de l'utilisateur
      description: >
        Indique si OAuth 3LO est configuré côté serveur et si l'utilisateur
        a connecté son compte Atlassian (tokens chiffrés).
      responses:
        '200':
          description: Statut Atlassian
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeAtlassian'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteMeAtlassian
      tags:
      - auth
      - integrations
      summary: Déconnecter le compte Atlassian
      description: Supprime les tokens OAuth Atlassian de l'utilisateur (CSRF requis).
      responses:
        '204':
          description: Déconnecté
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/tasks:
    get:
      operationId: listMyTasks
      tags:
      - tasks
      summary: Mes tâches assignées
      description: 'Auth + org active. Liste les `run_items` où `assigned_to` = utilisateur

        courant (IDOR garanti par le store). Périmètre : org active + sujets non

        archivés + runs non archivés (parité `ListAssignedRunItems`). Filtres

        `status` (pending|ok|nok|na) et `q` (sujet / modèle / label / section).

        '
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - ok
          - nok
          - na
        description: Filtre statut de l'item
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Recherche texte (sujet, modèle, label, section)
      responses:
        '200':
          description: Liste des tâches assignées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTaskListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /search:
    get:
      operationId: getSearch
      tags:
      - search
      summary: Recherche multi-entités
      description: |
        Auth + org active. Agrège sujets, revues, modèles (et tâches assignées
        quand la feature est réactivée) avec le même RBAC / filtres de visibilité
        que les listes correspondantes.
        `template` omis si l'appelant n'est pas membre org.
        `task` omis tant que l'assignation / Mes tâches est désactivée produit.
        v1 : `LIKE` via `searchTerms` (pas de FTS5).
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
        description: Texte libre (trim ; whitespace seul → 400)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 25
          default: 10
        description: Plafond de résultats par kind (défaut 10, max 25)
      responses:
        '200':
          description: Résultats groupables par kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: postAuthLogin
      tags:
      - auth
      summary: Connexion email + mot de passe
      description: 'Authentifie un compte local. CSRF requis (`X-CSRF-Token`, guest ou session).

        Pose le cookie `revues_session` en cas de succès.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register:
    post:
      operationId: postAuthRegister
      tags:
      - auth
      summary: Inscription email + mot de passe
      description: 'Crée un compte local si l''email est autorisé (invitation /
        bootstrap / self-service selon `REVUES_LOGIN_REQUIRE_WHITELIST`).

        CSRF guest requis. Pose `revues_session` en cas de succès.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé et session ouverte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags:
      - auth
      summary: Déconnexion
      description: 'Invalide la session courante et expire le cookie. CSRF session requis.

        '
      responses:
        '204':
          description: Déconnecté
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /orgs:
    get:
      operationId: listOrganizations
      tags:
      - orgs
      summary: Organisations de l'utilisateur
      description: 'Liste les organisations dont l''utilisateur est membre, l''org active

        de session (si définie), un défaut suggéré (`revues_last_org`), les

        invitations en attente, et si la création self-service est possible

        (aucune appartenance encore — parité pré-rewrite).

        '
      responses:
        '200':
          description: Liste org + invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createOrganization
      tags:
      - orgs
      summary: Créer une organisation (onboarding)
      description: 'Self-service : uniquement si l''utilisateur n''appartient encore à

        aucune organisation. Pose le créateur en `owner` et active l''org

        sur la session. CSRF requis.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organisation créée et activée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /orgs/active:
    post:
      operationId: selectActiveOrganization
      tags:
      - orgs
      summary: Sélectionner / basculer l'organisation active
      description: 'Active une organisation dont l''utilisateur est membre sur la session

        courante (sélecteur onboarding ou switcher). IDOR → 404. CSRF requis.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectOrganizationRequest'
      responses:
        '200':
          description: Organisation active mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /orgs/members:
    get:
      operationId: listOrgDirectory
      tags:
      - orgs
      summary: Annuaire membres de l'org active
      description: |
        Auth + org active. Liste minimale (id, email, display_name) des membres
        de l'organisation courante — destinée au sélecteur d'affectation projet
        (leads inclus, pas besoin d'être org admin).
      responses:
        '200':
          description: Membres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgDirectoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /orgs/invitations/{invitationID}/accept:
    post:
      operationId: acceptOrganizationInvitation
      tags:
      - orgs
      summary: Accepter une invitation d'organisation
      description: 'Ajoute le membre (si besoin), consomme l''invitation, active l''org.

        L''email de session doit correspondre à l''invitation (sinon 404).

        CSRF requis.

        '
      parameters:
      - name: invitationID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Invitation acceptée, org active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /subjects:
    get:
      operationId: listSubjects
      tags:
      - subjects
      summary: Liste des sujets de l'org active
      description: 'Auth + org active. Liste filtrée selon ResolveSubjectAccess

        (org admin / grants / legacy ungated). IDOR org : hors org → vide / 404.

        '
      parameters:
      - name: q
        in: query
        required: false
        description: Filtre texte (nom / description)
        schema:
          type: string
      responses:
        '200':
          description: Liste des sujets visibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createSubject
      tags:
      - subjects
      summary: Créer un sujet
      description: 'Auth + CanCreateSubject (editor+). CSRF requis. Domaines = matching

        modèles (jamais d''accès).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectWriteRequest'
      responses:
        '201':
          description: Sujet créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /subjects/{subjectId}:
    parameters:
    - $ref: '#/components/parameters/SubjectId'
    get:
      operationId: getSubject
      tags:
      - subjects
      summary: Détail d'un sujet
      description: 'Auth + CanViewAccess. Absent ou non visible → 404 (IDOR).

        Inclut domaines, membres directs et capacités UI.

        '
      responses:
        '200':
          description: Détail sujet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateSubject
      tags:
      - subjects
      summary: Modifier un sujet
      description: 'Auth + CanManageAccess. CSRF requis. Visibilité seulement si

        CanSetSubjectVisibility.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectWriteRequest'
      responses:
        '200':
          description: Sujet mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /subjects/{subjectId}/archive:
    parameters:
    - $ref: '#/components/parameters/SubjectId'
    post:
      operationId: archiveSubject
      tags:
      - subjects
      summary: Archiver un sujet
      description: Auth + CanManageAccess. CSRF requis. Soft-archive.
      responses:
        '204':
          description: Archivé
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /subjects/{subjectId}/members:
    parameters:
    - $ref: '#/components/parameters/SubjectId'
    get:
      operationId: listSubjectMembers
      tags:
      - subjects
      summary: Membres directs du sujet
      description: Auth + CanViewAccess. Liste `subject_members` seulement.
      responses:
        '200':
          description: Membres directs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectMemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: addSubjectMember
      tags:
      - subjects
      summary: Ajouter un membre direct
      description: 'Auth + CanManageSubjectMembers / CanInviteSubjectMember.

        L''invité doit déjà avoir un compte (email). CSRF requis.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSubjectMemberRequest'
      responses:
        '201':
          description: Membre ajouté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /subjects/{subjectId}/members/{userId}:
    parameters:
    - $ref: '#/components/parameters/SubjectId'
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    delete:
      operationId: removeSubjectMember
      tags:
      - subjects
      summary: Retirer un membre direct
      description: Auth + CanManageSubjectMembers. CSRF requis.
      responses:
        '204':
          description: Membre retiré
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /templates:
    get:
      operationId: listTemplates
      tags:
      - templates
      summary: Catalogue des modèles
      description: 'Liste les modèles actifs de l''organisation courante (dernière version).

        Recherche optionnelle sur nom et domaines (`q`).

        '
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Filtre texte (nom / domaines)
      responses:
        '200':
          description: Catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTemplate
      tags:
      - templates
      summary: Créer un modèle (version 1)
      description: 'Crée un modèle et publie immédiatement la version 1 (snapshot immuable).

        Réservé aux rôles editor+.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateWriteRequest'
      responses:
        '201':
          description: Modèle créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /templates/{templateId}:
    parameters:
    - $ref: '#/components/parameters/TemplateId'
    get:
      operationId: getTemplate
      tags:
      - templates
      summary: Détail modèle (dernière version)
      description: Renvoie le modèle avec sa dernière version publiée et ses items.
      responses:
        '200':
          description: Détail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: saveTemplate
      tags:
      - templates
      summary: Enregistrer (nouvelle version)
      description: 'Met à jour le nom / les domaines et **publie une nouvelle version** avec

        les items fournis. Les versions déjà publiées ne sont jamais mutées.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateWriteRequest'
      responses:
        '200':
          description: Nouvelle version publiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: archiveTemplate
      tags:
      - templates
      summary: Archiver un modèle
      description: Soft-delete (archive) — les versions publiées restent en base.
      responses:
        '204':
          description: Archivé
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /templates/{templateId}/versions:
    parameters:
    - $ref: '#/components/parameters/TemplateId'
    get:
      operationId: listTemplateVersions
      tags:
      - templates
      summary: Historique des versions
      description: Liste les versions publiées (plus récente en premier).
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTemplateVersion
      tags:
      - templates
      summary: Publier une nouvelle version
      description: 'Crée une nouvelle version immuable à partir des items fournis

        (sans changer le nom/domaines).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateVersionCreateRequest'
      responses:
        '201':
          description: Version publiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /templates/{templateId}/versions/{version}:
    parameters:
    - $ref: '#/components/parameters/TemplateId'
    - $ref: '#/components/parameters/TemplateVersionNumber'
    get:
      operationId: getTemplateVersion
      tags:
      - templates
      summary: Snapshot d'une version publiée
      description: Lecture seule — les versions publiées sont immuables.
      responses:
