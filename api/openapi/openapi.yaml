      - latest_version
      - item_count
      - domains
      - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        latest_version:
          type: integer
        item_count:
          type: integer
        domains:
          type: array
          items:
            type: string
        created_at:
          type: string
    TemplateListResponse:
