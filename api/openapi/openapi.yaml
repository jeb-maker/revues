        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TemplateItemInput'
    TemplateVersionCreateRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TemplateItemInput'
