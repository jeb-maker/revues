openapi: 3.0.3
info:
  title: Revues API
  version: 0.1.0
  description: 'Contrat HTTP JSON de Revues (`/api/v1`). Source de vérité pour le codegen

    serveur (oapi-codegen) et le client TypeScript (WP-005).

    '
servers:
- url: /api/v1
  description: API versionnée
tags:
- name: system
  description: Santé et métadonnées techniques (hors domaines métier)
- name: auth
  description: Session, login local, inscription, CSRF bootstrap
- name: orgs
  description: Organisations — liste, création, sélection active, invitations
- name: subjects
  description: Sujets (CRUD, membres, domaines, étiquettes)
- name: templates
  description: Modèles de check-list versionnés (catalogue + éditeur)
paths:
  /health:
    get:
      operationId: getHealth
      tags:
      - system
      summary: Santé de l'API versionnée
      description: 'Endpoint de health check sous le préfixe versionné. Distinct de

        `GET /healthz` (probe infra hors OpenAPI).

        '
      responses:
        '200':
          description: API joignable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /bootstrap:
    get:
      operationId: getBootstrap
      tags:
      - auth
      summary: Bootstrap session + CSRF
      description: 'Renvoie l''état d''auth courant et un `csrf_token` utilisable par le front.

        Sans session, pose un cookie guest court et dérive le CSRF de ce token.

        Avec session, renvoie l''utilisateur et le CSRF dérivé du cookie `revues_session`.

        '
      responses:
        '200':
          description: État bootstrap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      operationId: getMe
      tags:
      - auth
      summary: Utilisateur authentifié courant
      description: 'Exige une session valide. Renvoie le profil + CSRF (même dérivation que bootstrap).

        '
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: postAuthLogin
      tags:
      - auth
      summary: Connexion email + mot de passe
      description: 'Authentifie un compte local. CSRF requis (`X-CSRF-Token`, guest ou session).

        Pose le cookie `revues_session` en cas de succès.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register:
    post:
      operationId: postAuthRegister
      tags:
      - auth
      summary: Inscription email + mot de passe
      description: 'Crée un compte local si l''email est autorisé (whitelist / bootstrap).

        CSRF guest requis. Pose `revues_session` en cas de succès.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé et session ouverte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags:
      - auth
      summary: Déconnexion
      description: 'Invalide la session courante et expire le cookie. CSRF session requis.

        '
      responses:
        '204':
          description: Déconnecté
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /orgs:
    get:
      operationId: listOrganizations
      tags:
      - orgs
      summary: Organisations de l'utilisateur
      description: 'Liste les organisations dont l''utilisateur est membre, l''org active

        de session (si définie), un défaut suggéré (`revues_last_org`), les

        invitations en attente, et si la création self-service est possible

        (aucune appartenance encore — parité pré-rewrite).

        '
      responses:
        '200':
          description: Liste org + invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createOrganization
      tags:
      - orgs
      summary: Créer une organisation (onboarding)
      description: 'Self-service : uniquement si l''utilisateur n''appartient encore à

        aucune organisation. Pose le créateur en `owner` et active l''org

        sur la session. CSRF requis.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organisation créée et activée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /orgs/active:
    post:
      operationId: selectActiveOrganization
      tags:
      - orgs
      summary: Sélectionner / basculer l'organisation active
      description: 'Active une organisation dont l''utilisateur est membre sur la session

        courante (sélecteur onboarding ou switcher). IDOR → 404. CSRF requis.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectOrganizationRequest'
      responses:
        '200':
          description: Organisation active mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /orgs/invitations/{invitationID}/accept:
    post:
      operationId: acceptOrganizationInvitation
      tags:
      - orgs
      summary: Accepter une invitation d'organisation
      description: 'Ajoute le membre (si besoin), consomme l''invitation, active l''org.

        L''email de session doit correspondre à l''invitation (sinon 404).

        CSRF requis.

        '
      parameters:
      - name: invitationID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Invitation acceptée, org active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /subjects:
    get:
      operationId: listSubjects
      tags:
      - subjects
      summary: Liste des sujets de l'org active
      description: 'Auth + org active. Liste filtrée selon ResolveSubjectAccess

        (org admin / grants / legacy ungated). IDOR org : hors org → vide / 404.

        '
      parameters:
      - name: q
        in: query
        required: false
        description: Filtre texte (nom / description)
        schema:
          type: string
      responses:
        '200':
          description: Liste des sujets visibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createSubject
      tags:
      - subjects
      summary: Créer un sujet
      description: 'Auth + CanCreateSubject (editor+). CSRF requis. Domaines = matching

        modèles ; tags = classification descriptive (jamais d''accès).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectWriteRequest'
      responses:
        '201':
          description: Sujet créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /subjects/{subjectId}:
    parameters:
    - $ref: '#/components/parameters/SubjectId'
    get:
      operationId: getSubject
      tags:
      - subjects
      summary: Détail d'un sujet
      description: 'Auth + CanViewAccess. Absent ou non visible → 404 (IDOR).

        Inclut domaines, tags, membres directs et capacités UI.

        '
      responses:
        '200':
          description: Détail sujet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateSubject
      tags:
      - subjects
      summary: Modifier un sujet
      description: 'Auth + CanManageAccess. CSRF requis. Visibilité seulement si

        CanSetSubjectVisibility.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectWriteRequest'
      responses:
        '200':
          description: Sujet mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /subjects/{subjectId}/archive:
    parameters:
    - $ref: '#/components/parameters/SubjectId'
    post:
      operationId: archiveSubject
      tags:
      - subjects
      summary: Archiver un sujet
      description: Auth + CanManageAccess. CSRF requis. Soft-archive.
      responses:
        '204':
          description: Archivé
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /subjects/{subjectId}/members:
    parameters:
    - $ref: '#/components/parameters/SubjectId'
    get:
      operationId: listSubjectMembers
      tags:
      - subjects
      summary: Membres directs du sujet
      description: Auth + CanViewAccess. Liste `subject_members` seulement.
      responses:
        '200':
          description: Membres directs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectMemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: addSubjectMember
      tags:
      - subjects
      summary: Ajouter un membre direct
      description: 'Auth + CanManageSubjectMembers / CanInviteSubjectMember.

        L''invité doit déjà avoir un compte (email). CSRF requis.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSubjectMemberRequest'
      responses:
        '201':
          description: Membre ajouté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /subjects/{subjectId}/members/{userId}:
    parameters:
    - $ref: '#/components/parameters/SubjectId'
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    delete:
      operationId: removeSubjectMember
      tags:
      - subjects
      summary: Retirer un membre direct
      description: Auth + CanManageSubjectMembers. CSRF requis.
      responses:
        '204':
          description: Membre retiré
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /templates:
    get:
      operationId: listTemplates
      tags:
      - templates
      summary: Catalogue des modèles
      description: 'Liste les modèles actifs de l''organisation courante (dernière version).

        Recherche optionnelle sur nom et domaines (`q`).

        '
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Filtre texte (nom / domaines)
      responses:
        '200':
          description: Catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTemplate
      tags:
      - templates
      summary: Créer un modèle (version 1)
      description: 'Crée un modèle et publie immédiatement la version 1 (snapshot immuable).

        Réservé aux rôles editor+.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateWriteRequest'
      responses:
        '201':
          description: Modèle créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /templates/{templateId}:
    parameters:
    - $ref: '#/components/parameters/TemplateId'
    get:
      operationId: getTemplate
      tags:
      - templates
      summary: Détail modèle (dernière version)
      description: Renvoie le modèle avec sa dernière version publiée et ses items.
      responses:
        '200':
          description: Détail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: saveTemplate
      tags:
      - templates
      summary: Enregistrer (nouvelle version)
      description: 'Met à jour le nom / les domaines et **publie une nouvelle version** avec

        les items fournis. Les versions déjà publiées ne sont jamais mutées.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateWriteRequest'
      responses:
        '200':
          description: Nouvelle version publiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: archiveTemplate
      tags:
      - templates
      summary: Archiver un modèle
      description: Soft-delete (archive) — les versions publiées restent en base.
      responses:
        '204':
          description: Archivé
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /templates/{templateId}/versions:
    parameters:
    - $ref: '#/components/parameters/TemplateId'
    get:
      operationId: listTemplateVersions
      tags:
      - templates
      summary: Historique des versions
      description: Liste les versions publiées (plus récente en premier).
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTemplateVersion
      tags:
      - templates
      summary: Publier une nouvelle version
      description: 'Crée une nouvelle version immuable à partir des items fournis

        (sans changer le nom/domaines).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateVersionCreateRequest'
      responses:
        '201':
          description: Version publiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /templates/{templateId}/versions/{version}:
    parameters:
    - $ref: '#/components/parameters/TemplateId'
    - $ref: '#/components/parameters/TemplateVersionNumber'
    get:
      operationId: getTemplateVersion
      tags:
      - templates
      summary: Snapshot d'une version publiée
      description: Lecture seule — les versions publiées sont immuables.
      responses:
        '200':
          description: Version + items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs:
    get:
      operationId: listRuns
      tags:
        - runs
      summary: Liste des revues visibles
      description: Auth + org. Filtre status/q. Visibilite via ResolveSubjectAccess.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - in_progress
              - done
              - overdue
          description: Filtre statut
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Recherche texte
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /subjects/{subjectId}/runs:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      operationId: listSubjectRuns
      tags:
        - runs
      summary: Revues d'un sujet
      description: Auth + CanViewAccess sur le sujet.
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createRun
      tags:
        - runs
      summary: Lancer une revue (snapshot transactionnel)
      description: Auth + CanLaunchAccess. Copie SQL template_items vers run_items en transaction. CSRF requis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '201':
          description: Revue creee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /subjects/{subjectId}/run-templates:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      operationId: listSubjectRunTemplates
      tags:
        - runs
      summary: Modeles lanables pour un sujet
      description: Auth + CanViewAccess. Matching domaines sujet / modeles.
      responses:
        '200':
          description: Catalogue filtre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunTemplateListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      tags:
        - runs
      summary: Detail revue + items + progression
      description: Auth + Visible sur le sujet. Inclut capacites UI.
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs/{runId}/complete:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: completeRun
      tags:
        - runs
      summary: Cloturer une revue
      description: Auth + CanCompleteAccess. Bloque si points obligatoires pending. Emit review.completed. CSRF.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRunRequest'
      responses:
        '200':
          description: Revue cloturee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs/{runId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/RunItemId'
    get:
      operationId: getRunItem
      tags:
        - runs
      summary: Detail d'un point + audit
      description: Auth + Visible. Inclut historique run_item_events.
      responses:
        '200':
          description: Point
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunItemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateRunItem
      tags:
        - runs
      summary: Mettre a jour status/comment/assign
      description: Auth + CanUpdateAccess; assign exige CanAssignAccess. Comment obligatoire si nok. Run done -> 409. 
        Emit review.item.nok. CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRunItemRequest'
      responses:
        '200':
          description: Point mis a jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunItemDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Non authentifié ou identifiants invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF manquant/invalide ou refus
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource absente ou non visible (IDOR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflit métier (ex. version publiée immuable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Erreur interne
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: État de santé
          example: ok
          enum:
          - ok
    ErrorBody:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: validation_failed
        message:
          type: string
          example: Requête invalide.
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    User:
      type: object
      required:
      - id
      - login
      - email
      - display_name
      - role
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: string
        role:
          type: string
          description: Rôle global (admin|editor|reader)
    BootstrapResponse:
      type: object
      required:
      - authenticated
      - csrf_token
      - github_oauth_enabled
      properties:
        authenticated:
          type: boolean
        csrf_token:
          type: string
          description: Jeton CSRF à envoyer en header X-CSRF-Token sur les mutations
        user:
          $ref: '#/components/schemas/User'
        github_oauth_enabled:
          type: boolean
          description: true si REVUES_GITHUB_CLIENT_ID/SECRET sont configurés
        redirect:
          type: string
          description: Chemin SPA suggéré si déjà authentifié
    MeResponse:
      type: object
      required:
      - user
      - csrf_token
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RegisterRequest:
      type: object
      required:
      - email
      - display_name
      - password
      - password_confirm
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        password:
          type: string
          format: password
        password_confirm:
          type: string
          format: password
    AuthSuccessResponse:
      type: object
      required:
      - user
      - csrf_token
      - redirect
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
        redirect:
          type: string
          description: Chemin SPA post-login (org onboarding ou accueil)
    Organization:
      type: object
      required:
      - id
      - name
      - slug
      - role
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        role:
          type: string
          description: Rôle org (owner|admin|member)
        ui_subject_label:
          type: string
        ui_run_label:
          type: string
    OrganizationInvitation:
      type: object
      required:
      - id
      - organization_id
      - organization_name
      - org_role
      - created_at
      properties:
        id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        organization_name:
          type: string
        org_role:
          type: string
        created_at:
          type: string
    OrganizationListResponse:
      type: object
      required:
      - organizations
      - invitations
      - can_create
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationInvitation'
        active_organization_id:
          type: integer
          format: int64
          nullable: true
          description: Org active sur la session (null si pending)
        default_organization_id:
          type: integer
          format: int64
          nullable: true
          description: Suggestion depuis cookie revues_last_org si membre
        can_create:
          type: boolean
          description: true si l'utilisateur n'a encore aucune appartenance
        redirect:
          type: string
          description: Chemin SPA suggéré selon le nombre d'orgs
    CreateOrganizationRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          description: Optionnel — dérivé du nom si omis
    SelectOrganizationRequest:
      type: object
      required:
      - organization_id
      properties:
        organization_id:
          type: integer
          format: int64
    OrganizationActionResponse:
      type: object
      required:
      - organization
      - redirect
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        redirect:
          type: string
          description: Chemin SPA après action (accueil)
    SubjectSummary:
      type: object
      required:
      - id
      - name
      - description
      - visibility
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum:
          - normal
          - private
          description: Visibilité sujet (private exige grant explicite)
    SubjectListResponse:
      type: object
      required:
      - subjects
      - can_create
      properties:
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectSummary'
        can_create:
          type: boolean
          description: true si l'utilisateur peut créer un sujet (editor+)
    SubjectCapabilities:
      type: object
      required:
      - can_manage
      - can_manage_members
      - can_set_visibility
      - can_launch
      properties:
        can_manage:
          type: boolean
          description: Modifier / archiver
        can_manage_members:
          type: boolean
          description: Inviter / retirer des membres directs
        can_set_visibility:
          type: boolean
          description: Changer subjects.visibility
        can_launch:
          type: boolean
          description: Lancer une revue (contributor+ effectif)
    SubjectAccessInfo:
      type: object
      required:
      - role
      - sources
      properties:
        role:
          type: string
          description: Rôle effectif (lead|contributor|viewer|"")
        sources:
          type: array
          items:
            type: string
          description: Sources d'accès (direct, team:N, org_admin, …)
    SubjectMember:
      type: object
      required:
      - user_id
      - login
      - email
      - display_name
      - role
      properties:
        user_id:
          type: integer
          format: int64
        login:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          type: string
          enum:
          - lead
          - contributor
          - viewer
    SubjectMemberListResponse:
      type: object
      required:
      - members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/SubjectMember'
    SubjectDetail:
      type: object
      required:
      - id
      - name
      - description
      - visibility
      - domains
      - tags
      - members
      - access
      - capabilities
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum:
          - normal
          - private
        domains:
          type: array
          items:
            type: string
          description: Domaines de matching modèles (pas d'accès)
        tags:
          type: array
          items:
            type: string
          description: Étiquettes descriptives (pas d'accès)
        members:
          type: array
          items:
            $ref: '#/components/schemas/SubjectMember'
        access:
          $ref: '#/components/schemas/SubjectAccessInfo'
        capabilities:
          $ref: '#/components/schemas/SubjectCapabilities'
    SubjectWriteRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        domains:
          type: array
          items:
            type: string
          description: Domaines de matching (CSV côté legacy)
        tags:
          type: array
          items:
            type: string
        visibility:
          type: string
          enum:
          - normal
          - private
          description: Ignoré si CanSetSubjectVisibility est faux
    AddSubjectMemberRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - lead
          - contributor
          - viewer
