          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/integrations/confluence/test:
    post:
      operationId: postAdminConfluenceTest
      tags:
        - admin
      summary: Tester la connexion Confluence Cloud
      description: |
        Auth + RequireOrgAdmin + CSRF. Utilise la config stockée via
        GET /wiki/rest/api/user/current. Client HTTP anti-SSRF (`internal/safehttp`).
      responses:
        '204':
          description: Connexion réussie
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs/{runId}/confluence:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRunConfluence
      tags:
        - integrations
      summary: État publication Confluence d'une revue
      description: |
        Auth + accès sujet/revue (IDOR). Renvoie si Confluence est configuré,
        si l'utilisateur peut publier (contributeur+), et le lien éventuel.
      responses:
        '200':
          description: État Confluence de la revue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunConfluence'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: postRunConfluencePublish
      tags:
        - integrations
      summary: Publier une revue clôturée vers Confluence
      description: |
        Auth + CanPublishConfluence (contributeur+) + CSRF. La revue doit être
        `done`. Crée une page (titre, méta, points, liens Jira nok) et stocke l'URL.
      responses:
        '201':
          description: Page créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfluenceLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs/{runId}/items/{itemId}/jira:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/RunItemId'
    get:
      operationId: getRunItemJira
      tags:
        - integrations
      summary: Lien Jira et contexte création pour un point
      description: |
        Auth + accès sujet/revue (IDOR). Renvoie le lien éventuel, l'état configuré,
        et les valeurs par défaut pour créer un ticket (si nok).
      responses:
        '200':
          description: État Jira du point
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunItemJira'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: putRunItemJiraLink
      tags:
        - integrations
      summary: Lier une issue Jira existante au point
      description: |
        Auth + CanLinkJira (contributeur+) + CSRF. Vérifie l'issue via API Jira
        (safehttp), stocke clé + URL browse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraLinkRequest'
      responses:
        '200':
          description: Lien enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: postRunItemJiraCreate
      tags:
        - integrations
      summary: Créer une issue Jira depuis un point nok
      description: |
        Auth + CanLinkJira + CSRF. Point doit être `nok`, pas déjà lié, project_key
        configuré. Titre/description optionnels (préremplissage serveur sinon).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraCreateRequest'
      responses:
        '201':
          description: Ticket créé et lié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/webhooks:
    get:
      operationId: getAdminWebhooks
      tags:
        - admin
      summary: Configuration webhooks sortants (secret masqué)
      description: |
        Auth + RequireOrgAdmin. Singleton org (liste d'URLs + secret HMAC +
        événements). Le secret n'est jamais renvoyé — `has_secret` seulement.
        SPA : `/admin/settings/webhooks`.
      responses:
        '200':
          description: Config courante (ou vide si non configurée)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: putAdminWebhooks
      tags:
        - admin
      summary: Enregistrer la configuration webhooks chiffrée
      description: |
        Auth + RequireOrgAdmin + CSRF. Secret omis ou vide = conserve le secret
        existant (`MergeWebhookSecret`). URLs validées (scheme + anti-SSRF).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSettingsUpdate'
      responses:
        '200':
          description: Config enregistrée (secret masqué)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteAdminWebhooks
      tags:
        - admin
      summary: Effacer la configuration webhooks
      description: Auth + RequireOrgAdmin + CSRF.
      responses:
        '204':
          description: Configuration effacée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/webhooks/test:
    post:
      operationId: postAdminWebhooksTest
      tags:
        - admin
      summary: Envoyer un événement webhook.test
      description: |
        Auth + RequireOrgAdmin + CSRF. Utilise la config stockée (chiffrée) et
        le Dispatcher (HMAC + anti-SSRF + file `webhook_deliveries`).
      responses:
        '204':
          description: Test enfilé / livré (au moins une tentative)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/webhooks/deliveries:
    get:
      operationId: listAdminWebhookDeliveries
      tags:
        - admin
      summary: File des livraisons webhooks (org active)
      description: |
        Auth + RequireOrgAdmin. Liste récente des lignes `webhook_deliveries`
        de l'organisation active (payload omis).
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Livraisons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/webhooks/deliveries/drain:
    post:
      operationId: postAdminWebhookDeliveriesDrain
      tags:
        - admin
      summary: Déclencher un drain manuel de la file
      description: |
        Auth + RequireOrgAdmin + CSRF. Exécute `Dispatcher.Drain` (même logique
        que le cron in-process 1′).
      responses:
        '204':
          description: Drain exécuté
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/webhooks/deliveries/{deliveryId}/retry:
    parameters:
      - $ref: '#/components/parameters/WebhookDeliveryId'
    post:
      operationId: postAdminWebhookDeliveryRetry
      tags:
        - admin
      summary: Réessayer une livraison (pending ou poison)
      description: |
        Auth + RequireOrgAdmin + CSRF + IDOR org. Remet `state=pending`,
        `next_attempt_at=now`, réinitialise attempts / TTL, puis drain.
      responses:
        '204':
          description: Livraison reprogrammée
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs/{runId}/items/{itemId}/attachments:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/RunItemId'
    get:
      operationId: getRunItemAttachment
      tags:
        - attachments
      summary: Métadonnées pièce jointe du point
      description: |
        Auth + accès sujet/revue (IDOR). 404 si aucune pièce ou point hors revue.
      responses:
        '200':
          description: Métadonnées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: uploadRunItemAttachment
      tags:
        - attachments
      summary: Upload pièce jointe (magic bytes, max 5 Mo)
      description: |
        Auth + CanUpdateAccess + run in_progress + CSRF.
        multipart field `file` (JPEG/PNG/WebP/PDF). Remplace l'éventuelle PJ existante.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Fichier (magic bytes validés côté serveur)
      responses:
        '201':
          description: Pièce jointe enregistrée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Corps trop volumineux
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs/{runId}/items/{itemId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/RunItemId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: downloadRunItemAttachment
      tags:
        - attachments
      summary: Télécharger une pièce jointe
      description: |
        Auth + accès sujet/revue (IDOR). Content-Disposition attachment ;
        Content-Type = mime stocké. Vérifie runId/itemId vs attachment.
      responses:
        '200':
          description: Contenu binaire
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="…"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Non authentifié ou identifiants invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF manquant/invalide ou refus
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource absente ou non visible (IDOR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflit métier (ex. version publiée immuable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Erreur interne
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: État de santé
          example: ok
          enum:
          - ok
    ErrorBody:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: validation_failed
        message:
          type: string
          example: Requête invalide.
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    User:
      type: object
      required:
      - id
      - login
      - email
      - display_name
      - role
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: string
        role:
          type: string
          description: Rôle global (admin|editor|reader)
    BootstrapResponse:
      type: object
      required:
      - authenticated
      - csrf_token
      - github_oauth_enabled
      - atlassian_oauth_enabled
      properties:
        authenticated:
          type: boolean
        csrf_token:
          type: string
          description: Jeton CSRF à envoyer en header X-CSRF-Token sur les mutations
        user:
          $ref: '#/components/schemas/User'
        github_oauth_enabled:
          type: boolean
          description: true si REVUES_GITHUB_CLIENT_ID/SECRET sont configurés
        atlassian_oauth_enabled:
          type: boolean
          description: true si REVUES_ATLASSIAN_CLIENT_ID/SECRET sont configurés
        redirect:
          type: string
          description: Chemin SPA suggéré si déjà authentifié
    MeResponse:
      type: object
      required:
      - user
      - csrf_token
      - atlassian_oauth_enabled
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
        atlassian_oauth_enabled:
          type: boolean
          description: true si REVUES_ATLASSIAN_CLIENT_ID/SECRET sont configurés
    MeAtlassian:
      type: object
      required:
      - enabled
      - connected
      - site_url
      - account_email
      - cloud_id
      properties:
        enabled:
          type: boolean
          description: true si OAuth Atlassian est configuré côté serveur
        connected:
          type: boolean
          description: true si l'utilisateur a des tokens Atlassian stockés
        site_url:
          type: string
          description: URL du site Atlassian lié (vide si non connecté)
        account_email:
          type: string
          description: Email Atlassian (si disponible)
        cloud_id:
          type: string
          description: cloudId Atlassian (vide si non connecté)
    SearchResultKind:
      type: string
      enum:
      - subject
      - run
      - template
      - task
    SearchResult:
      type: object
      required:
      - kind
      - id
      - title
      - href
      properties:
        kind:
          $ref: '#/components/schemas/SearchResultKind'
        id:
          type: integer
          format: int64
          description: Identifiant de l'entité (item id pour kind=task)
        title:
          type: string
        subtitle:
          type: string
          description: Contexte court (sujet, domaines, section…)
        href:
          type: string
          description: Chemin SPA relatif (ex. /subjects/12)
    SearchResponse:
      type: object
      required:
      - results
      - total_by_kind
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        total_by_kind:
          type: object
          additionalProperties:
            type: integer
          description: Nombre de matches par kind avant plafond `limit`
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - password_confirm
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
        password_confirm:
          type: string
          format: password
          minLength: 12
          maxLength: 72
    AuthSuccessResponse:
      type: object
      required:
      - user
      - csrf_token
      - redirect
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
        redirect:
          type: string
          description: Chemin SPA post-login (org onboarding ou accueil)
    Organization:
      type: object
      required:
      - id
      - name
      - slug
      - role
      - member_count
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        role:
          type: string
          description: Rôle org (owner|admin|member)
        ui_subject_label:
          type: string
        ui_run_label:
          type: string
        member_count:
          type: integer
          description: Nombre de membres de l'organisation (disclosure Mes tâches / assign)
        visible_subject_count:
          type: integer
          description: Sujets visibles pour l'appelant dans cette org (colonne Sujet si ≥ 2)
    OrganizationInvitation:
      type: object
      required:
      - id
      - organization_id
      - organization_name
      - org_role
      - created_at
      properties:
        id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        organization_name:
          type: string
        org_role:
          type: string
        created_at:
          type: string
    AdminInvitation:
      type: object
      required:
      - id
      - email
      - org_role
      - created_at
      - email_queued
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        org_role:
          type: string
          enum: [owner, admin, member]
        created_at:
          type: string
        email_queued:
          type: boolean
          description: true si une ligne email_deliveries a été enqueued
    AdminInvitationListResponse:
      type: object
      required:
      - invitations
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/AdminInvitation'
    AdminInvitationCreateRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
        org_role:
          type: string
          enum: [owner, admin, member]
          default: member
    OrgDirectoryEntry:
      type: object
      required:
      - user_id
      - email
      - display_name
      properties:
        user_id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        display_name:
          type: string
    OrgDirectoryResponse:
      type: object
      required:
      - members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/OrgDirectoryEntry'
    OrganizationListResponse:
      type: object
      required:
      - organizations
      - invitations
      - can_create
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationInvitation'
        active_organization_id:
          type: integer
          format: int64
          nullable: true
          description: Org active sur la session (null si pending)
        default_organization_id:
          type: integer
          format: int64
          nullable: true
          description: Suggestion depuis cookie revues_last_org si membre
        can_create:
          type: boolean
          description: true si l'utilisateur n'a encore aucune appartenance
        redirect:
          type: string
          description: Chemin SPA suggéré selon le nombre d'orgs
    CreateOrganizationRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          description: Optionnel — dérivé du nom si omis
    SelectOrganizationRequest:
      type: object
      required:
      - organization_id
      properties:
        organization_id:
          type: integer
          format: int64
    OrganizationActionResponse:
      type: object
      required:
      - organization
      - redirect
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        redirect:
          type: string
          description: Chemin SPA après action (accueil)
    SubjectSummary:
      type: object
      required:
      - id
      - name
      - description
      - visibility
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum:
          - normal
          - private
          description: Visibilité sujet (private exige grant explicite)
    SubjectListResponse:
      type: object
      required:
      - subjects
      - can_create
      properties:
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectSummary'
        can_create:
          type: boolean
          description: true si l'utilisateur peut créer un sujet (editor+)
    SubjectCapabilities:
      type: object
      required:
      - can_manage
      - can_manage_members
      - can_set_visibility
      - can_launch
      properties:
        can_manage:
          type: boolean
          description: Modifier / archiver
        can_manage_members:
          type: boolean
          description: Inviter / retirer des membres directs
        can_set_visibility:
          type: boolean
          description: Changer subjects.visibility
        can_launch:
          type: boolean
          description: Lancer une revue (contributor+ effectif)
    SubjectAccessInfo:
      type: object
      required:
      - role
      - sources
