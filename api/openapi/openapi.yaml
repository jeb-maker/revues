        run_item_id:
          type: integer
          format: int64
        filename:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
        is_image:
          type: boolean
          description: true si mime image affichable inline

    WebhookSettings:
      type: object
      required:
        - configured
        - enabled
        - urls
        - has_secret
        - review_completed
        - review_item_nok
      properties:
        configured:
          type: boolean
          description: true si une config est stockée
        enabled:
          type: boolean
          description: true si au moins une URL + secret permettent la livraison
        urls:
          type: array
          items:
            type: string
            format: uri
          description: URLs cibles (https ; http://localhost en dev)
        has_secret:
          type: boolean
          description: true si un secret HMAC est stocké (jamais renvoyé en clair)
        review_completed:
          type: boolean
        review_item_nok:
          type: boolean
    WebhookSettingsUpdate:
      type: object
      required:
        - urls
        - review_completed
        - review_item_nok
      properties:
        urls:
          type: array
          items:
            type: string
          minItems: 1
          description: Au moins une URL
        secret:
          type: string
          description: Omis ou vide = conserve le secret existant
        review_completed:
          type: boolean
        review_item_nok:
          type: boolean
    WebhookDeliveryList:
      type: object
      required:
        - deliveries
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
    WebhookDelivery:
      type: object
      required:
        - id
        - event_id
        - event_type
        - url
        - success
        - attempts
        - state
        - created_at
      properties:
        id:
          type: integer
          format: int64
        event_id:
          type: string
        event_type:
          type: string
        url:
          type: string
        status_code:
          type: integer
          nullable: true
        success:
          type: boolean
        attempts:
          type: integer
        next_attempt_at:
          type: string
          nullable: true
        expires_at:
          type: string
          nullable: true
        state:
          type: string
          enum:
            - pending
            - done
            - poison
        last_error:
          type: string
          nullable: true
        created_at:
          type: string
  parameters:
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Identifiant du modèle
    TemplateVersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Numéro de version publiée (1, 2, …)
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Identifiant de la revue
    RunItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Identifiant du point (run item)
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Identifiant de la pièce jointe
    WebhookDeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Identifiant d'une ligne webhook_deliveries
