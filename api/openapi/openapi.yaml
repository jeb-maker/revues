      - name
      - domains
      - version
      - items
      - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        domains:
          type: array
          items:
            type: string
        version:
          $ref: '#/components/schemas/TemplateVersionSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateItem'
        created_at:
          type: string
        can_manage:
