version: "2"
sql:
  - engine: "sqlite"
    schema: "docs/schema/canonical.sql"
    queries: "internal/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "database/sql"
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "INTEGER"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
